name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v

  phaser:
    name: Phaser / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engines/phaser-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engines/phaser-typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Seven-game browser smoke
        run: python3 tests/browser_smoke.py

  macroquad:
    name: Macroquad / Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engines/macroquad-rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engines/macroquad-rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engines/macroquad-rust/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings

  ebitengine:
    name: Ebitengine / Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engines/ebitengine-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: engines/ebitengine-go/go.sum
      - run: sudo apt-get update && sudo apt-get install -y xauth xvfb
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: xvfb-run -a go test ./...
      - run: xvfb-run -a go vet ./...
      - run: xvfb-run -a go test -race ./...

  raylib:
    name: raylib / C
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engines/raylib-c
    steps:
      - uses: actions/checkout@v7
      - name: Native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libasound2-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxkbcommon-dev libxxf86vm-dev
      - uses: actions/cache@v6
        with:
          path: engines/raylib-c/build/_deps
          key: raylib-${{ runner.os }}-${{ hashFiles('engines/raylib-c/CMakeLists.txt') }}
      - run: cmake -S . -B build -G Ninja -DKOFUN_FETCH_RAYLIB=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  love:
    name: LÖVE / Lua
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Lua syntax and rules
        run: |
          find engines/love2d-lua -type f -name '*.lua' \
            -print0 | xargs -0 -n1 luac -p
          (cd engines/love2d-lua && lua tests/rules_test.lua)

  godot:
    name: Godot / GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: godot-cache
        uses: actions/cache@v6
        with:
          path: /tmp/godot.zip
          key: godot-4.7.1-linux-x86_64
      - if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      - name: Seven-game headless smoke
        run: |
          unzip -q /tmp/godot.zip -d /tmp/godot
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path engines/godot-gdscript \
            --script res://tests/smoke_test.gd

  defold:
    name: Defold / Lua
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - id: bob-cache
        uses: actions/cache@v6
        with:
          path: /tmp/bob.jar
          key: defold-bob-1.12.4
      - if: steps.bob-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            -o /tmp/bob.jar \
            https://github.com/defold/defold/releases/download/1.12.4/bob.jar
      - name: Lua syntax and runtime smoke
        run: |
          find engines/defold-lua -type f \
            \( -name '*.lua' -o -name '*.script' -o -name '*.gui_script' \) \
            -print0 | xargs -0 -n1 luac -p
          (cd engines/defold-lua && lua tests/runtime_smoke.lua)
      - name: Bob clean build
        run: |
          echo "54ac57d9712fcd1e9de63f405803d159d88a2fbe940b8ef058ba503aa418fa18  /tmp/bob.jar" \
            | sha256sum --check
          java -jar /tmp/bob.jar --root engines/defold-lua clean build
